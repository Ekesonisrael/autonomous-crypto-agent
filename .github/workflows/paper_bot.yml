name: Paper Trading Agent Loop

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour on the hour
  workflow_dispatch:     # Allows you to trigger a manual run anytime from GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

   - name: Run Paper Trading Cycle
      run: |
        export PYTHONPATH=$PWD
        python execution/paper_engine.py

    - name: Commit Trade Logs / State Updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add trade_history.json || echo "No new log changes"
        git commit -m "Auto-update trade history and critic state [skip ci]" || echo "No changes to commit"
        git push || echo "No remote changes to push"
